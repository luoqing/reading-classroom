<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#3b4655" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#718096"/>
    </marker>
    <style>
      .title{font:700 36px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#1f2937}
      .subtitle{font:400 17px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#667085}
      .group{font:600 17px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#64748b;letter-spacing:1px}
      .nodeTitle{font:700 22px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#1f2937}
      .nodeText{font:400 15px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#64748b}
      .edge{fill:none;stroke:#718096;stroke-width:3;marker-end:url(#arrow)}
      .edgeAccent{fill:none;stroke:#e58b46;stroke-width:4;marker-end:url(#arrow)}
      .edgeDash{fill:none;stroke:#7c8aa0;stroke-width:3;stroke-dasharray:9 8;marker-end:url(#arrow)}
      .edgeLabel{font:600 14px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#475569}
      .badge{font:600 13px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#9a5b24}
    </style>
  </defs>
  <rect width="1600" height="980" fill="#f8fafc"/>
  <text x="70" y="66" class="title">朗读小屋·教学版：数据实体关系</text>
  <text x="70" y="98" class="subtitle">8 个核心实体，兼顾学习历史、最新进度、原声回放与评测追溯</text>

  <rect x="45" y="135" width="390" height="760" rx="28" fill="#f2f6fb" stroke="#d7e0ea"/>
  <rect x="475" y="135" width="1000" height="260" rx="28" fill="#f7f6f0" stroke="#e8e1c9"/>
  <rect x="475" y="425" width="1000" height="470" rx="28" fill="#f5f8f5" stroke="#dce7dc"/>
  <text x="70" y="173" class="group">账号与权限</text>
  <text x="500" y="173" class="group">课文原生数据</text>
  <text x="500" y="463" class="group">学生学习档案</text>

  <g filter="url(#shadow)">
    <rect x="90" y="245" width="300" height="120" rx="20" fill="#fff" stroke="#8aa4c7" stroke-width="2"/>
    <text x="120" y="284" class="nodeTitle">user_account</text>
    <text x="120" y="314" class="nodeText">学生 / 老师账号、班级、状态</text>
    <text x="120" y="340" class="nodeText">密码摘要、失败次数、最后登录</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="90" y="525" width="300" height="120" rx="20" fill="#fff" stroke="#8aa4c7" stroke-width="2"/>
    <text x="120" y="564" class="nodeTitle">user_session</text>
    <text x="120" y="594" class="nodeText">安全会话、到期时间、撤销时间</text>
    <text x="120" y="620" class="nodeText">设备信息与最近活动时间</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="560" y="215" width="350" height="130" rx="20" fill="#fff" stroke="#d5b868" stroke-width="2"/>
    <text x="590" y="254" class="nodeTitle">lesson</text>
    <text x="590" y="284" class="nodeText">标题、正文、全文拼音、评分规则</text>
    <text x="590" y="310" class="nodeText">封面、完整示范、视频母版、修订号</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1050" y="215" width="350" height="130" rx="20" fill="#fff" stroke="#d5b868" stroke-width="2"/>
    <text x="1080" y="254" class="nodeTitle">lesson_page</text>
    <text x="1080" y="284" class="nodeText">封面页 + 正文页、逐页文字和拼音</text>
    <text x="1080" y="310" class="nodeText">插画、逐页示范、视频时间段</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="540" y="520" width="390" height="135" rx="20" fill="#fff" stroke="#80a886" stroke-width="2.5"/>
    <text x="570" y="559" class="nodeTitle">reading_attempt</text>
    <text x="570" y="589" class="nodeText">学生一次完整练习与原始录音</text>
    <text x="570" y="615" class="nodeText">课文修订号、录音模式、时长、状态</text>
    <text x="815" y="552" class="badge">历史主记录</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1050" y="520" width="350" height="135" rx="20" fill="#fff" stroke="#80a886" stroke-width="2"/>
    <text x="1080" y="559" class="nodeTitle">reading_clip</text>
    <text x="1080" y="589" class="nodeText">封面 / 逐页配音片段</text>
    <text x="1080" y="615" class="nodeText">页面、顺序、音频位置与时长</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="540" y="740" width="390" height="135" rx="20" fill="#fff" stroke="#8c9fb8" stroke-width="2"/>
    <text x="570" y="779" class="nodeTitle">student_lesson_progress</text>
    <text x="570" y="809" class="nodeText">学生 × 课文唯一一条最新进度</text>
    <text x="570" y="835" class="nodeText">最新朗读、最新评测、次数、最近练习</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1050" y="740" width="350" height="135" rx="20" fill="#fff" stroke="#e39a62" stroke-width="2.5"/>
    <text x="1080" y="779" class="nodeTitle">reading_evaluation</text>
    <text x="1080" y="809" class="nodeText">讯飞 SID / 原始 XML / 算法版本</text>
    <text x="1080" y="835" class="nodeText">三维星级、评语、问题字句和时间段</text>
  </g>

  <path d="M240 365 V525" class="edge"/>
  <rect x="255" y="428" width="90" height="28" rx="14" fill="#eef2f7"/>
  <text x="270" y="447" class="edgeLabel">1 对多会话</text>

  <path d="M390 305 H500 V588 H540" class="edgeAccent"/>
  <rect x="420" y="463" width="112" height="28" rx="14" fill="#fff1e7"/>
  <text x="434" y="482" class="edgeLabel">学生 1 对多朗读</text>

  <path d="M910 280 H1050" class="edge"/>
  <rect x="928" y="244" width="105" height="28" rx="14" fill="#f3f0e4"/>
  <text x="942" y="263" class="edgeLabel">1 对多有序页</text>

  <path d="M735 345 V520" class="edgeAccent"/>
  <rect x="753" y="419" width="105" height="28" rx="14" fill="#fff1e7"/>
  <text x="767" y="438" class="edgeLabel">课文 1 对多</text>

  <path d="M930 588 H1050" class="edge"/>
  <rect x="936" y="548" width="105" height="28" rx="14" fill="#eef5ee"/>
  <text x="950" y="567" class="edgeLabel">1 对多片段</text>

  <path d="M1225 345 V520" class="edge"/>
  <rect x="1243" y="419" width="105" height="28" rx="14" fill="#f3f0e4"/>
  <text x="1257" y="438" class="edgeLabel">页面 1 对多</text>

  <path d="M930 620 H990 V807 H1050" class="edgeAccent"/>
  <rect x="953" y="690" width="126" height="28" rx="14" fill="#fff1e7"/>
  <text x="967" y="709" class="edgeLabel">1 对多评测版本</text>

  <path d="M390 330 H460 V807 H540" class="edge"/>
  <rect x="402" y="684" width="124" height="28" rx="14" fill="#eef2f7"/>
  <text x="416" y="703" class="edgeLabel">学生 × 课文进度</text>

  <path d="M735 740 V655" class="edgeDash"/>
  <rect x="750" y="680" width="116" height="28" rx="14" fill="#eef2f7"/>
  <text x="764" y="699" class="edgeLabel">指向最新朗读</text>

  <path d="M930 824 H1015 V852 H1050" class="edgeDash"/>
  <rect x="936" y="842" width="116" height="28" rx="14" fill="#eef2f7"/>
  <text x="950" y="861" class="edgeLabel">指向最新评测</text>

  <rect x="1085" y="914" width="320" height="36" rx="18" fill="#fff4e9" stroke="#f0c79f"/>
  <text x="1105" y="938" class="edgeLabel">文件本体存妙搭文件存储，数据库只保存定位信息</text>
</svg>
